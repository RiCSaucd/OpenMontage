<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      background: #1C1C1C;
      color: #F2EDE4;
      font-family: Inter, system-ui, sans-serif;
    }
    .bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 50%, rgba(107,29,42,0.3) 0%, transparent 70%),
        #1C1C1C;
    }
    .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 100px;
      letter-spacing: 0.1em;
    }
    p { margin-top: 24px; font-size: 24px; color: #C5A46E; letter-spacing: 0.15em; }
    .platforms { margin-top: 48px; font-size: 18px; color: #8A8580; letter-spacing: 0.12em; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="content">
    <h1>STREAM ENDED</h1>
    <p>Thanks for riding with Vince</p>
    <div class="platforms">FOLLOW FOR CLIPS · TWITCH · KICK · YOUTUBE · TIKTOK</div>
  </div>
</body>
</html>
