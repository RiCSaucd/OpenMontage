<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      background: #1C1C1C;
      color: #F2EDE4;
      font-family: Inter, system-ui, sans-serif;
    }
    .bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #1C1C1C 0%, #2A2A2E 100%);
    }
    .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 120px;
      letter-spacing: 0.15em;
    }
    p {
      margin-top: 24px;
      font-size: 28px;
      color: #8A8580;
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="content">
    <h1>BE RIGHT BACK</h1>
    <p>Same rules. Different city.</p>
  </div>
</body>
</html>
