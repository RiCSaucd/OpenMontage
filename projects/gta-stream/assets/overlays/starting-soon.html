<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      background: #1C1C1C;
      color: #F2EDE4;
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 50% 100%, rgba(232,168,56,0.2) 0%, transparent 60%),
        linear-gradient(160deg, #1C1C1C 0%, #2A2A2E 50%, #1E2A32 100%);
    }
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.06;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    }
    .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 160px;
      letter-spacing: 0.1em;
      line-height: 0.9;
    }
    .arrow { color: #E8A838; font-size: 80px; margin: 8px 0; }
    p {
      margin-top: 32px;
      font-size: 28px;
      color: #C5A46E;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }
    .status {
      margin-top: 48px;
      font-size: 22px;
      color: #8A8580;
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="grain"></div>
  <div class="content">
    <h1>BENSONHURST</h1>
    <div class="arrow">→</div>
    <h1>LS</h1>
    <p>Starting Soon</p>
    <div class="status">Vince Genovese · GTA Mafia RP</div>
  </div>
</body>
</html>
