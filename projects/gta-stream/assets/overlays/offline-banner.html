<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      background: #1C1C1C;
      color: #F2EDE4;
      font-family: Inter, system-ui, sans-serif;
    }
    .bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 50% 40% at 50% 60%, rgba(232,168,56,0.15) 0%, transparent 70%),
        #1C1C1C;
    }
    .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 120px;
      letter-spacing: 0.12em;
    }
    .arrow { color: #E8A838; font-size: 64px; margin: 8px 0; }
    p { margin-top: 32px; font-size: 28px; color: #8A8580; letter-spacing: 0.2em; }
    .status {
      margin-top: 24px;
      padding: 12px 32px;
      background: #6B1D2A;
      font-size: 20px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="content">
    <h1>BENSONHURST</h1>
    <div class="arrow">→</div>
    <h1>LS</h1>
    <p>Vince Genovese · GTA Mafia RP</p>
    <div class="status">Currently Offline</div>
  </div>
</body>
</html>
